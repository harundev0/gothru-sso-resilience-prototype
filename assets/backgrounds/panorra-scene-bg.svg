<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Panorra scene background: two light fans aimed at the centre, soft halo behind the card, fine grain -->
  <defs>
    <radialGradient id="pink" cx="50%" cy="100%" r="70%" gradientTransform="translate(0 .5) scale(1 .5) translate(0 -1)"><stop offset="0" stop-color="#ec4899" stop-opacity=".08"/><stop offset=".7" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="fadeA" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="864"><stop offset=".06" stop-color="#fff" stop-opacity="0"/><stop offset=".24" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="fadeB" gradientUnits="userSpaceOnUse" cx="1920" cy="1080" r="864"><stop offset=".06" stop-color="#fff" stop-opacity="0"/><stop offset=".24" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="mA"><rect width="1920" height="1080" fill="url(#fadeA)"/></mask>
    <mask id="mB"><rect width="1920" height="1080" fill="url(#fadeB)"/></mask>
